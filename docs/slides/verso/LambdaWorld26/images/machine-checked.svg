<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Fira Sans, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14161f"/></marker><marker id="arrI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b4a6"/></marker></defs>
<rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="280" height="90" rx="10" fill="#ffffff" stroke="#b9b4a6" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="150" y="50" font-size="22" font-weight="700" fill="#6b6f7b" text-anchor="middle">Source</text>
<text x="150" y="76" font-size="16" fill="#6b6f7b" text-anchor="middle">Rust, C, or hand-written</text>
<path d="M150,100 L150,224" stroke="#b9b4a6" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
<text x="164" y="160" font-size="16" font-weight="700" fill="#6b6f7b">any compiler</text>
<text x="164" y="180" font-size="15" fill="#6b6f7b">not trusted</text>
<rect x="10" y="230" width="280" height="90" rx="10" fill="#ffffff" stroke="#14161f" stroke-width="2.5"/>
<text x="150" y="270" font-size="22" font-weight="700" fill="#14161f" text-anchor="middle">ELF binary</text>
<text x="150" y="296" font-size="16" fill="#6b6f7b" text-anchor="middle">RISC-V, x86, ARM</text>
<path d="M290,275 L424,275" stroke="#14161f" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="357" y="264" font-size="16" font-weight="700" fill="#14161f" text-anchor="middle">elf2lean</text>
<rect x="430" y="230" width="280" height="90" rx="10" fill="#ffffff" stroke="#14161f" stroke-width="2.5"/>
<text x="570" y="270" font-size="22" font-weight="700" fill="#14161f" text-anchor="middle">Decoded instructions</text>
<text x="570" y="296" font-size="16" fill="#6b6f7b" text-anchor="middle">in Lean, on a model of the machine</text>
<path d="M570,230 L570,106" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrI)"/>
<text x="584" y="172" font-size="16" font-weight="700" fill="#4338ca">Lean proof</text>
<rect x="430" y="10" width="280" height="90" rx="10" fill="#4338ca"/>
<text x="570" y="50" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Formal specification</text>
<text x="570" y="76" font-size="16" fill="#dcdaf7" text-anchor="middle">what the program should do</text>
</svg>
